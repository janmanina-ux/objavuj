name: Aktualizovat a publikovat Objavuj

on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: objavuj-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout protected main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - name: Load previous publication
        shell: bash
        run: |
          git fetch origin gh-pages
          git worktree add --detach "$RUNNER_TEMP/objavuj-pages" origin/gh-pages
          if [ -f "$RUNNER_TEMP/objavuj-pages/data/latest.json" ]; then
            cp "$RUNNER_TEMP/objavuj-pages/data/latest.json" data/latest.json
          fi
          if [ -f "$RUNNER_TEMP/objavuj-pages/data/discovered.json" ]; then
            cp "$RUNNER_TEMP/objavuj-pages/data/discovered.json" data/discovered.json
          fi

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Import RSS with fallback to previous articles
        run: python scripts/update_feeds.py

      - name: Discover article links from category listings
        run: python scripts/discover_links.py

      - name: Automatically enrich RSS articles with AI
        env:
          OBJAVUJ_AI_ENABLED: ${{ vars.OBJAVUJ_AI_ENABLED || 'true' }}
          OBJAVUJ_AI_MAX_PER_RUN: ${{ vars.OBJAVUJ_AI_MAX_PER_RUN || '10' }}
          OBJAVUJ_AI_MODEL: ${{ vars.OBJAVUJ_AI_MODEL || 'gpt-4.1-mini' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/ai_enrich.py

      - name: Prepare published site
        shell: bash
        run: |
          mkdir -p public/data public/icons
          cp index.html sw.js manifest.webmanifest public/
          cp icons/icon.svg public/icons/
          cp data/latest.json data/library.json data/discover.json public/data/
          cp data/discovered.json public/data/
          touch public/.nojekyll
          test -s public/index.html
          python -m json.tool public/data/latest.json > /dev/null

      - name: Store published snapshot on gh-pages (not main)
        shell: bash
        run: |
          TARGET="$RUNNER_TEMP/objavuj-pages"
          rsync -a --delete --exclude='.git' public/ "$TARGET/"
          git -C "$TARGET" config user.name 'github-actions[bot]'
          git -C "$TARGET" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$TARGET" add -A
          if ! git -C "$TARGET" diff --cached --quiet; then
            git -C "$TARGET" commit -m 'Publish latest Objavuj content'
            git -C "$TARGET" push origin HEAD:gh-pages
          else
            echo 'No changes in published content'
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload publication artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy Pages explicitly
        id: deployment
        uses: actions/deploy-pages@v4
